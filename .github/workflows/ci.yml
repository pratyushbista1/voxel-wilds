name: Core CSharp tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 8.0.x
      - name: Test world generation, fluids, mobs, inventory, crafting and saves
        run: dotnet run --project Tests/CoreTests.csproj --configuration Release
      - name: Check Unity metadata
        shell: pwsh
        run: ./scripts/update-unity-meta.ps1 -Check
      - name: Check PowerShell script syntax
        shell: pwsh
        run: |
          foreach ($script in Get-ChildItem scripts -Filter *.ps1) {
            $parseErrors = $null
            [System.Management.Automation.Language.Parser]::ParseFile($script.FullName, [ref]$null, [ref]$parseErrors) | Out-Null
            if ($parseErrors.Count -gt 0) { throw ($parseErrors | Out-String) }
          }
