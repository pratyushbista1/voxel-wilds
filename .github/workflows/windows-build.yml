name: Unity Windows build
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v6
      - name: Check build license configuration
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        run: |
          if [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ] || { [ -z "$UNITY_LICENSE" ] && [ -z "$UNITY_SERIAL" ]; }; then
            echo 'Configure a supported Unity CI license and the required repository secrets before dispatching this optional build. Local builds use scripts/build-unity.ps1 and the activated Unity Hub license.'
            exit 1
          fi
      - uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL }}
        with:
          unityVersion: 6000.3.23f1
          targetPlatform: StandaloneWindows64
          buildMethod: VoxelWilds.Editor.BuildGame.BuildWindows
          versioning: Custom
          version: 2.0.3
          allowDirtyBuild: true
      - uses: actions/upload-artifact@v6
        with:
          name: Voxel-Wilds-Unity-Windows
          path: release/2.0.3/Windows/
          if-no-files-found: error
          retention-days: 14
